<div class="demande__form revele">
          <form class="formulaire" id="bordereau" novalidate
                action="mailto:contact@dsg-renov.ch" method="post" enctype="text/plain">
            <div class="formulaire__entete trace trace--bas">
              <p class="etiquette"><b>Bordereau</b> — Demande de devis</p>
              <p class="etiquette">Champs marqués <span style="color:var(--c-signal)">*</span> obligatoires</p>
            </div>

            <div class="champ">
              <label class="champ__label" for="nom">Nom et prénom <span>*</span></label>
              <input type="text" id="nom" name="nom" autocomplete="name" required placeholder="Marie Dupont">
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ">
              <label class="champ__label" for="email">Courriel <span>*</span></label>
              <input type="email" id="email" name="email" autocomplete="email" required placeholder="marie.dupont@exemple.ch">
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ">
              <label class="champ__label" for="telephone">Téléphone <span>*</span></label>
              <input type="tel" id="telephone" name="telephone" autocomplete="tel" required placeholder="+41 79 000 00 00">
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ">
              <label class="champ__label" for="type">Type de bien <span>*</span></label>
              <select id="type" name="type" required>
                <option value="">Choisir…</option>
                <option>Appartement</option>
                <option>Maison / villa</option>
                <option>Immeuble / régie</option>
                <option>Local commercial</option>
              </select>
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ">
              <label class="champ__label" for="surface">Surface approximative</label>
              <input type="text" id="surface" name="surface" inputmode="numeric" placeholder="120 m²">
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ">
              <label class="champ__label" for="lieu">Commune du bien</label>
              <input type="text" id="lieu" name="lieu" autocomplete="address-level2" placeholder="Lausanne">
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ formulaire__large">
              <label class="champ__label" for="delai">Démarrage souhaité</label>
              <select id="delai" name="delai">
                <option value="">Choisir…</option>
                <option>Dès que possible</option>
                <option>Dans 1 à 3 mois</option>
                <option>Dans 3 à 6 mois</option>
                <option>Pas encore décidé</option>
              </select>
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ formulaire__large">
              <label class="champ__label" for="message">Décrivez votre projet <span>*</span></label>
              <textarea id="message" name="message" required placeholder="Pièces concernées, travaux envisagés, contraintes particulières…"></textarea>
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="champ formulaire__large">
              <!-- Le renvoi vit hors du label : à l'intérieur, un clic sur le
                   lien cocherait aussi la case. -->
              <div class="consentement">
                <input type="checkbox" id="consentement" name="consentement" required>
                <label for="consentement">J'accepte que DSG Rénovation utilise ces informations pour me recontacter au sujet de ma demande. Aucune donnée n'est transmise à des tiers.</label>
              </div>
              <p class="consentement__renvoi"><a href="confidentialite.html">Lire la politique de confidentialité</a></p>
              <p class="champ__erreur" aria-live="polite"></p>
            </div>

            <div class="formulaire__large">
              <button class="btn btn--plein" type="submit" style="width:100%" data-magnetique>Envoyer ma demande<span class="fleche" aria-hidden="true"></span></button>
              <p class="message-formulaire" id="bordereauRetour" role="status" tabindex="-1" style="margin-top:var(--sp-4)"></p>
            </div>
          </form>
        </div>
