# Mise en ligne du site sur GitHub Pages, en un seul passage.
#
# La publication « depuis une branche » enchaîne trois tâches (build,
# deploy, report-build-status) qui attendent chacune une machine libre ;
# quand GitHub Actions est lent, un push suivant annule celui qui attend
# encore, et le site ne bouge pas. Ici, une seule tâche publie le dépôt
# tel quel (le site est déjà assemblé par outils/construire.py), et un
# push ne coupe jamais une mise en ligne commencée : le suivant attend son
# tour, puis publie la dernière version.
#
# Machine : à chaque push, une machine de GitHub. Quand GitHub n'en
# attribue plus (panne d'Actions, githubstatus.com), lancer ce workflow à
# la main (Actions → Mise en ligne → Run workflow) avec la machine « mac » :
# il tourne alors sur le Mac de l'agence, enregistré comme machine de
# déploiement (self-hosted, macOS, ARM64). Chaque machine a sa file : une
# mise en ligne coincée chez GitHub ne bloque pas celle du Mac.
#
# Actif quand la source de Pages est « GitHub Actions »
# (Settings → Pages → Build and deployment → Source). Sinon, il vérifie la
# source et s'arrête sans rien publier.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      machine:
        description: "Machine qui publie"
        type: choice
        options: [github, mac]
        default: github

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ inputs.machine || 'github' }}
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ${{ inputs.machine == 'mac' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Source de Pages
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_type',''))")
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" != "workflow" ]; then
            echo "::notice::Source de Pages : « $type ». Rien à publier ici : passer la source à « GitHub Actions » pour activer ce déploiement."
          fi

      - uses: actions/checkout@v4
        if: steps.source.outputs.type == 'workflow'

      - uses: actions/configure-pages@v5
        if: steps.source.outputs.type == 'workflow'

      # L'archive que Pages attend (artifact.tar, artefact « github-pages »),
      # faite à la main : la même commande sert au tar de Linux et à celui
      # de macOS, sans rien installer sur le Mac.
      - name: Archive du site
        if: steps.source.outputs.type == 'workflow'
        shell: bash
        run: tar -h -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github -C "$GITHUB_WORKSPACE" .

      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.type == 'workflow'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: publication
        uses: actions/deploy-pages@v4
        if: steps.source.outputs.type == 'workflow'
