# TEMPORAIRE : où se règlent les DNS de dsg-renov.ch (lecture seule).
# Ne doit pas arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Délégation et zones
        run: |
          echo "=== délégation au registre .ch"
          tld=$(dig +short NS ch. | head -1)
          dig +norec NS dsg-renov.ch @"$tld" | grep -E 'IN\s+NS' || true
          for ns in ns11.infomaniak.ch ns12.infomaniak.ch ns09.domaincontrol.com ns10.domaincontrol.com; do
            echo "=== réponse de $ns"
            for q in "SOA dsg-renov.ch" "NS dsg-renov.ch" "A dsg-renov.ch" "AAAA dsg-renov.ch" "CNAME www.dsg-renov.ch" "A www.dsg-renov.ch" "MX dsg-renov.ch" "TXT dsg-renov.ch"; do
              set -- $q
              echo "$q: $(dig +short +norec $1 $2 @$ns | tr '\n' ' ') [$(dig +norec $1 $2 @$ns | grep -o 'status: [A-Z]*' | head -1)]"
            done
          done
          echo "=== résolveurs publics"
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "$r: A=$(dig +short A dsg-renov.ch @$r | tr '\n' ' ') www=$(dig +short A www.dsg-renov.ch @$r | tr '\n' ' ') NS=$(dig +short NS dsg-renov.ch @$r | tr '\n' ' ')"
          done
