# TEMPORAIRE : contrôle des adresses sans .html sur le site réel (lecture
# seule). Ne doit pas arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Adresses sur le site réel
        run: |
          sleep 45   # laisse la mise en ligne de main se terminer
          t() { printf '%-48s -> %s\n' "$1" "$(curl -sS -o /tmp/c --max-time 20 -w '%{http_code} %{redirect_url}' "$1" 2>&1) $(grep -o '<title>[^<|—]*' /tmp/c | head -1 | cut -c8-45)"; }
          for p in / /services /services/peinture /services/renovation-salle-de-bains /devis "/devis?travaux=peinture" /realisations /entreprise /merci /mentions-legales /confidentialite \
                   /services.html /services/peinture.html "/devis.html?erreur=1" /index.html \
                   /services/ /services/peinture/ /devis/ \
                   /projets /prestations /contact /r%C3%A9alisations \
                   /page-inconnue /envoi-reglages.php /README.md /sitemap.xml; do
            t "https://www.dsg-renov.ch$p"
          done
          t "http://dsg-renov.ch/services.html"
          echo "=== envoi.php (GET)"; curl -sS -o /dev/null -w '%{http_code}\n' https://www.dsg-renov.ch/envoi.php
          echo "=== sitemap"; curl -sS https://www.dsg-renov.ch/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//'
          echo "=== canonique de /services/peinture"; curl -sS https://www.dsg-renov.ch/services/peinture | grep -o '<link rel="canonical"[^>]*>'
