# TEMPORAIRE : contrôle des adresses sur le site réel (lecture seule).
# Ne doit pas arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Adresses sur le site réel
        run: |
          sleep 45
          t() { printf '%-48s -> %s\n' "$1" "$(curl -sS -o /tmp/c --max-time 20 -w '%{http_code} %{redirect_url}' "$1" 2>&1) $(grep -o '<title>[^<|—]*' /tmp/c | head -1 | cut -c8-45)"; }
          for p in / /services /services/ /services.html /services/index.html /prestations /services/peinture /services/peinture.html /services/peinture/ \
                   /devis /devis/ "/devis.html?erreur=1" /realisations /entreprise /merci /projets /contact /page-inconnue; do
            t "https://www.dsg-renov.ch$p"
          done
          echo "=== suivi complet depuis http://dsg-renov.ch/services.html"
          curl -sS -L -o /dev/null --max-time 30 -w '%{http_code} après %{num_redirects} redirections → %{url_effective}\n' http://dsg-renov.ch/services.html
          echo "=== tous les liens de la page /services/"
          curl -sS https://www.dsg-renov.ch/services/ | grep -oE 'href="[^"#]*"' | sed 's/href="//;s/"$//' | grep -vE '^(https?:|mailto:|tel:)' | sort -u | while read l; do
            u=$(python3 -c "import sys,urllib.parse;print(urllib.parse.urljoin('https://www.dsg-renov.ch/services/',sys.argv[1]))" "$l")
            printf '%s %s\n' "$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$u")" "$u"
          done | sort | uniq -c | awk '{print $2}' | sort | uniq -c
