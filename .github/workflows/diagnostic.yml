# TEMPORAIRE : contrôle du certificat HTTPS (lecture seule). Ne doit pas
# arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certificat et redirections
        run: |
          for h in www.dsg-renov.ch dsg-renov.ch; do
            echo "=== certificat présenté pour $h"
            echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "(aucun)"
          done
          echo "=== chemins (certificat vérifié, sans -k)"
          for u in http://dsg-renov.ch/ http://www.dsg-renov.ch/ https://dsg-renov.ch/ https://www.dsg-renov.ch/ https://www.dsg-renov.ch/devis.html https://www.dsg-renov.ch/sitemap.xml https://www.dsg-renov.ch/projets; do
            printf '%-42s -> %s\n' "$u" "$(curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "$u" 2>&1)"
          done
          echo "=== titre et icône de l'accueil"
          curl -sS --max-time 20 https://www.dsg-renov.ch/ | grep -oE '<title>[^<]*|<link rel="icon"[^>]*>' | head -3
          curl -sS -o /dev/null --max-time 20 -w 'favicon.ico : %{http_code} %{content_type}\n' https://www.dsg-renov.ch/favicon.ico
