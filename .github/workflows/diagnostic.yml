# TEMPORAIRE : formulaire sur le serveur, sans envoyer de courriel (les
# demandes sont incomplètes : envoi.php les refuse avant tout envoi), et
# lecture de l'aide Infomaniak sur mail(). Ne doit pas arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aide Infomaniak (mail, PHPMailer)
        run: |
          for u in \
            "https://www.infomaniak.com/fr/support/faq/2150/utiliser-lenvoi-non-authentifie-non-recommande-de-mail-depuis-un-site-web" \
            "https://www.infomaniak.com/fr/support/faq/576/utiliser-phpmailer-sur-infomaniak"; do
            echo "=================== $u"
            curl -sSL --max-time 30 -A 'Mozilla/5.0' "$u" | python3 -c '
          import html, re, sys
          t = sys.stdin.read()
          t = re.sub(r"(?is)<(script|style|noscript|svg)[^>]*>.*?</\1>", " ", t)
          t = re.sub(r"(?i)<br\s*/?>|</(p|li|h[1-6]|div|tr)>", "\n", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          lignes = [re.sub(r"[ \t]+", " ", l).strip() for l in t.splitlines()]
          texte = "\n".join(l for l in lignes if l)
          i = texte.find("mail")
          print(texte[:9000])
          '
          done

      - name: Formulaire sur le serveur (refusé avant envoi)
        run: |
          u=https://www.dsg-renov.ch/envoi.php
          o="-sS -k --max-time 120 --resolve www.dsg-renov.ch:443:185.176.225.20"
          python3 - <<'PY'
          import os
          def jpeg(nom, octets):
              with open(nom, "wb") as f:
                  f.write(b"\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00")
                  f.write(os.urandom(octets - 20))
          jpeg("p79.jpg", int(7.9 * 1048576))
          for i in range(3):
              jpeg(f"p65-{i}.jpg", int(6.5 * 1048576))
          PY
          ls -la *.jpg
          echo "=== 1. GET"
          curl $o -o /dev/null -w '%{http_code}\n' "$u"
          echo "=== 2. demande vide (JSON)"
          curl $o -H 'Accept: application/json' -X POST -F 'nom=' "$u" -w '\n%{http_code}\n'
          echo "=== 3. demande vide (sans JavaScript)"
          curl $o -X POST -F 'nom=' "$u" -o /dev/null -w '%{http_code} %{redirect_url}\n'
          echo "=== 4. demande sans nom + une photo de 7,9 Mo (upload_max_filesize)"
          curl $o -H 'Accept: application/json' -X POST -F 'telephone=021 000 00 00' -F 'message=essai' -F 'photos[]=@p79.jpg;type=image/jpeg' "$u" -w '\n%{http_code}\n'
          echo "=== 5. demande sans nom + trois photos de 6,5 Mo (post_max_size)"
          curl $o -H 'Accept: application/json' -X POST -F 'telephone=021 000 00 00' -F 'message=essai' \
            -F 'photos[]=@p65-0.jpg;type=image/jpeg' -F 'photos[]=@p65-1.jpg;type=image/jpeg' -F 'photos[]=@p65-2.jpg;type=image/jpeg' "$u" -w '\n%{http_code}\n'
          echo "=== 6. en-têtes de la réponse"
          curl $o -sI -X POST -H 'Accept: application/json' "$u" | grep -iE '^(HTTP|content-type|cache-control|x-powered-by)'
