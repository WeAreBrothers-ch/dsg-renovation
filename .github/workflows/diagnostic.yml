# TEMPORAIRE : enregistrements de l'ancienne zone (GoDaddy) à reporter
# dans la nouvelle (Infomaniak). Lecture seule. Ne doit pas arriver sur main.
name: Diagnostic

on:
  push:
    branches: [claude/dreamy-bardeen-pbumqx]

permissions:
  contents: read

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ancienne zone et nouvelle zone
        run: |
          noms="@ www mail webmail email smtp imap pop autodiscover autoconfig calendar agenda drive docs sites groups ftp m shop blog app api cdn _dmarc google._domainkey default._domainkey k1._domainkey selector1._domainkey selector2._domainkey dkim._domainkey mail._domainkey s1._domainkey s2._domainkey _domainconnect _autodiscover._tcp _sip._tls _sipfederationtls._tcp _caldavs._tcp _carddavs._tcp _imaps._tcp _submission._tcp"
          for ns in ns09.domaincontrol.com ns11.infomaniak.ch; do
            echo "=================== $ns"
            for n in $noms; do
              if [ "$n" = "@" ]; then f=dsg-renov.ch; else f=$n.dsg-renov.ch; fi
              for t in A AAAA CNAME MX TXT SRV CAA NS; do
                r=$(dig +short +norec $t $f @$ns | tr '\n' ' ')
                [ -n "$r" ] && echo "$n $t: $r"
              done
            done
          done
